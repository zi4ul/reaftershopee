<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Post Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: light dark; --bg:#f2f2f7; --fg:#111; --mut:#6b6b76; --line:#dcdce3; --acc:#0a6cff; --ok:#0a8a3a; --bad:#c62828; --card:#fff; --soft:#eef3ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0d0f; --fg:#eee; --mut:#9a9aa3; --line:#2c2d33; --acc:#4c9aff; --ok:#3ecf74; --bad:#ff6b6b; --card:#17181c; --soft:#16233a; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: 64px; scroll-behavior: smooth; }
  body { margin:0 auto; max-width:640px; padding:max(12px, env(safe-area-inset-top)) 14px calc(150px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:22px; margin:4px 0 10px; } .mut { color:var(--mut); font-size:14px; }
  label { display:block; margin:12px 0 6px; font-weight:600; font-size:14px; }
  input[type=text], input[type=password], input[type=url], textarea, input[type=datetime-local] { width:100%; min-height:44px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:16px/1.4 inherit; }
  button { min-height:44px; padding:10px 16px; border:0; border-radius:10px; background:var(--acc); color:#fff; font-size:16px; font-weight:600; margin:8px 8px 0 0; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.45; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:8px; }
  .ok { color:var(--ok); font-weight:700; } .bad { color:var(--bad); font-weight:700; } .over { color:var(--bad); font-weight:700; }
  .msg { white-space:pre-wrap; margin-top:8px; font-size:14px; }
  .plat { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .plat button { margin:0; }
  .panel[hidden] { display:none; }

  /* indikator langkah (tautan #st1..#st5, jalan tanpa JS) */
  .stepper { position:sticky; top:0; z-index:5; display:flex; gap:6px; list-style:none; margin:0 -14px 6px; padding:8px 14px; background:var(--bg); }
  .stepper li { flex:1; } .stepper a { display:block; text-align:center; padding:8px 0; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--mut); font-size:12px; font-weight:600; text-decoration:none; min-height:44px; }
  .stepper a b { display:block; font-size:15px; color:var(--fg); }
  .stepper a.on { background:var(--acc); border-color:var(--acc); color:#fff; } .stepper a.on b { color:#fff; }
  .stepper a.fin { background:var(--soft); border-color:var(--acc); }   /* BUKAN .done: itu kelas layar sukses (fixed, layar penuh) */

  /* kartu langkah */
  .step { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:12px; }
  .step h2 { display:flex; align-items:center; gap:10px; font-size:17px; margin:0 0 8px; }
  .step h2 .num { flex:none; width:26px; height:26px; border-radius:50%; background:var(--acc); color:#fff; font-size:14px; line-height:26px; text-align:center; }
  .step .box { background:transparent; border:0; padding:0; margin:0; }

  /* langkah 1: video */
  .seg { display:flex; gap:4px; padding:4px; margin:4px 0 10px; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
  .seg button { flex:1; margin:0; border-radius:9px; min-height:40px; padding:8px 6px; font-size:15px; transition:background .2s, color .2s; }
  .seg button:not(.on) { background:transparent; color:var(--mut); border:0; }
  .pickfile { display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; border:2px dashed var(--acc); border-radius:14px; color:var(--acc); font-weight:700; font-size:16px; margin:0; cursor:pointer; background:var(--soft); }
  #file { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .vprev { display:flex; gap:12px; align-items:center; margin-top:10px; }
  .vprev .vthumb, .vprev .vnothumb { flex:none; width:72px; height:128px; border-radius:10px; object-fit:cover; background:var(--line); }
  .vprev .vnothumb { display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--mut); }
  .vrow { display:flex; gap:10px; align-items:center; padding:8px; margin-top:8px; border:2px solid var(--line); border-radius:14px; background:var(--card); cursor:pointer; transition:border-color .2s, background .2s, transform .1s; animation:rise .25s ease both; }
  .vrow:active { transform:scale(.985); }
  .vrow.sel { border-color:var(--acc); background:var(--soft); }
  .vrow .vthumb, .vrow .vnothumb { width:48px; height:86px; border-radius:6px; object-fit:cover; flex:none; background:var(--line); }
  .vrow .vnothumb { display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--mut); }
  .vrow .vtxt { flex:1; min-width:0; } .vrow .vname { font-weight:600; font-size:15px; overflow-wrap:anywhere; } .vrow .vmeta { font-size:13px; color:var(--mut); }
  .vrow button { margin:0; padding:8px 10px; flex:none; }
  .locked { opacity:.55; }
  #lib-list .mut { text-align:center; padding:18px 8px; }
  .step, .jcard { animation:rise .3s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes pop { 0% { transform:scale(.4); opacity:0; } 70% { transform:scale(1.08); } 100% { transform:scale(1); opacity:1; } }

  /* langkah 2: platform (kartu ketuk) */
  .pchips { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .pchip { margin:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:76px; padding:10px 4px; border:2px solid var(--line); border-radius:14px; text-align:center; font-weight:700; font-size:14px; background:var(--card); cursor:pointer; }
  .pchip input { position:absolute; opacity:0; inset:0; margin:0; width:100%; height:100%; cursor:pointer; }
  .pchip:has(input:checked) { border-color:var(--acc); background:var(--soft); color:var(--acc); }
  .pchip:has(input:checked)::after { content:"✓"; position:absolute; top:4px; right:6px; font-size:13px; }

  /* langkah 3: produk (tab Shopee / TikTok, murni CSS) */
  .tabr { position:absolute; opacity:0; pointer-events:none; }
  .tabbar { display:flex; margin:0 0 10px; }
  .tabbar label { flex:1; margin:0; text-align:center; padding:11px 0; min-height:44px; font-size:15px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .tabbar label:first-child { border-radius:10px 0 0 10px; } .tabbar label:last-child { border-radius:0 10px 10px 0; }
  #ptab-shopee:checked ~ .tabbar label[for=ptab-shopee], #ptab-tiktok:checked ~ .tabbar label[for=ptab-tiktok] { background:var(--acc); border-color:var(--acc); color:#fff; }
  #ptab-shopee:checked ~ #prod-tiktok, #ptab-tiktok:checked ~ #prod-shopee { display:none; }
  .pgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:8px; }
  .pcard { position:relative; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg); cursor:pointer; }
  .pcard.sel { border-color:var(--acc); }
  .pcard .pimg { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--card); }
  .pcard .noimg { width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; background:var(--card); color:var(--mut); font-size:26px; }
  .pcard .pname { padding:4px 6px 6px; font-size:12px; line-height:1.3; height:2.9em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .pcard .pchk { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:var(--acc); color:#fff; font-size:14px; font-weight:700; line-height:24px; text-align:center; }
  .pcard.sel .pname { color:var(--acc); font-weight:700; }

  /* langkah 5: jadwal */
  .when { display:flex; gap:8px; } .when label { flex:1; margin:0; }
  .when .opt { display:flex; align-items:center; justify-content:center; min-height:48px; border:2px solid var(--line); border-radius:12px; font-weight:600; font-size:15px; background:var(--card); cursor:pointer; }
  .when input { position:absolute; opacity:0; pointer-events:none; }
  .when input:checked + .opt { border-color:var(--acc); background:var(--soft); color:var(--acc); }
  #sched { margin-top:10px; }
  label.chk { display:flex; align-items:center; gap:10px; margin:12px 0 0; min-height:44px; font-weight:500; font-size:15px; }
  label.chk input { width:22px; height:22px; }


  /* Daftar Job: kartu bergambar (thumbnail video + produk dulu, lalu teks dan status) */
  .jcard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:12px; }
  .jvis { display:flex; gap:10px; align-items:flex-start; }
  .jthumb, .jnothumb { flex:none; width:64px; height:114px; border-radius:10px; object-fit:cover; background:var(--line); }
  .jnothumb { display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--mut); }
  .jprods { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .jpl { font-size:12px; font-weight:700; color:var(--mut); margin-bottom:3px; }
  .jpthumbs { display:flex; flex-wrap:wrap; gap:6px; }
  .jp, .jpno { width:44px; height:44px; border-radius:8px; object-fit:cover; background:var(--line); }
  .jpno { display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--mut); }
  .jhead { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-top:10px; }
  .jtitle { font-weight:700; overflow-wrap:anywhere; }
  .jbadge { flex:none; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--soft); }
  .jbadge.ok { background:rgba(10,138,58,.15); } .jbadge.bad { background:rgba(198,40,40,.15); }
  .jmeta { font-size:13px; color:var(--mut); margin-top:2px; }
  .jcard .resume button, .jcard > button { min-height:44px; }

  /* layar sukses setelah kirim (menutup halaman Buat Posting sampai "Kirim lagi" diketuk) */
  .done { position:fixed; inset:0; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); background:var(--bg); text-align:center; animation:fadein .25s ease both; }
  .done[hidden] { display:none; }
  .done .tick { width:84px; height:84px; border-radius:50%; background:var(--ok); color:#fff; font-size:46px; line-height:84px; animation:pop .45s ease both; }
  .done h2 { margin:6px 0 0; font-size:22px; }
  .done .sum { width:100%; max-width:420px; text-align:left; }
  .done .sum div { display:flex; justify-content:space-between; gap:10px; padding:10px 12px; margin-top:6px; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:15px; }
  .done .sum b { font-weight:700; } .done .sum span { color:var(--mut); text-align:right; }
  .done button { width:100%; max-width:420px; min-height:50px; margin:6px 0 0; font-size:17px; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

  /* tombol Kirim menempel di atas bilah tab (zona jempol) */
  .dock { position:fixed; left:0; right:0; bottom:calc(54px + env(safe-area-inset-bottom)); z-index:6; padding:10px 14px; background:var(--bg); border-top:1px solid var(--line); }
  .dock .in { max-width:640px; margin:0 auto; }
  .dock #send { width:100%; margin:0; min-height:50px; font-size:17px; }
  .dock #sendmsg { margin-top:6px; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:7; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; margin:0; border-radius:0; background:transparent; color:var(--mut); padding:14px 4px; font-size:14px; min-height:54px; }
  nav button[aria-selected=true] { color:var(--acc); }
</style>
</head>
<body>
<h1>Post Hub</h1>

<section class="panel" data-panel="buat">
  <ol class="stepper" id="stepper">
    <li><a id="sg1" href="#st1" data-go="1"><b>1</b>Video</a></li>
    <li><a id="sg2" href="#st2" data-go="2"><b>2</b>Platform</a></li>
    <li><a id="sg3" href="#st3" data-go="3"><b>3</b>Produk</a></li>
    <li><a id="sg4" href="#st4" data-go="4"><b>4</b>Teks</a></li>
    <li><a id="sg5" href="#st5" data-go="5"><b>5</b>Jadwal</a></li>
  </ol>

  <div class="step" id="st1" data-step="1">
    <h2><span class="num">1</span> Pilih video</h2>
    <div id="vidgate" class="mut"></div>
    <div class="seg">
      <button id="vtab-file" class="on">Dari HP</button>
      <button id="vtab-lib" class="sec">Pernah diunggah</button>
    </div>
    <div id="vpanel-file">
      <label class="pickfile" for="file">🎬 Pilih video dari HP</label>
      <input id="file" type="file" accept="video/*">
    </div>
    <div id="vpanel-lib" class="box" hidden>
      <div class="plat"><span id="lib-msg" class="mut"></span><button id="lib-reload" class="sec">Muat ulang</button></div>
      <div id="lib-list"></div>
    </div>
    <div class="vprev">
      <div id="vthumb" class="vnothumb">🎞</div>
      <div id="vinfo" class="mut">Belum ada video.</div>
    </div>
  </div>

  <div class="step" id="st2" data-step="2">
    <h2><span class="num">2</span> Posting ke mana?</h2>
    <div class="pchips">
      <label class="pchip"><input id="p-shopee" type="checkbox" checked>Shopee Video<span id="cnt-shopee" class="mut"></span></label>
      <label class="pchip"><input id="p-tiktok" type="checkbox" checked>TikTok<span id="cnt-tiktok" class="mut"></span></label>
      <label class="pchip"><input id="p-instagram" type="checkbox" checked>Instagram<span id="cnt-instagram" class="mut"></span></label>
    </div>
  </div>

  <div class="step" id="st3" data-step="3">
    <h2><span class="num">3</span> Pilih produk</h2>
    <div class="box" id="prodbox">
      <input class="tabr" type="radio" name="ptab" id="ptab-shopee" checked>
      <input class="tabr" type="radio" name="ptab" id="ptab-tiktok">
      <div class="tabbar"><label id="ptlab-shopee" for="ptab-shopee">Shopee</label><label id="ptlab-tiktok" for="ptab-tiktok">TikTok</label></div>
      <div class="plat"><span id="prod-msg" class="mut"></span><button id="prod-reload" class="sec">Muat ulang</button></div>
      <div id="prod-shopee"></div>
      <div id="prod-tiktok"></div>
    </div>
  </div>

  <div class="step" id="st4" data-step="4">
    <h2><span class="num">4</span> Deskripsi</h2>
    <textarea id="desc" rows="4" placeholder="Tulis deskripsi video"></textarea>
    <label for="tags">Hashtag</label>
    <input id="tags" type="text" placeholder="#diskon #fashion" autocapitalize="off" autocorrect="off">
  </div>

  <div class="step" id="st5" data-step="5">
    <h2><span class="num">5</span> Kapan diposting?</h2>
    <div class="when">
      <label><input id="when-now" type="radio" name="when" checked><span class="opt">Sekarang</span></label>
      <label><input id="when-sched" type="radio" name="when"><span class="opt">Jadwalkan</span></label>
    </div>
    <input id="sched" type="datetime-local" hidden>
    <label class="chk"><input id="keep" type="checkbox" checked> Simpan video di Drive agar bisa dipakai lagi</label>
    <div id="errs" class="bad msg"></div>
    <div id="warns" class="mut msg"></div>
  </div>

  <div class="dock"><div class="in">
    <button id="send" disabled>Kirim</button>
    <div id="sendmsg" class="mut msg"></div>
  </div></div>
</section>

<section class="panel" data-panel="daftar" hidden>
  <button id="jobs-reload" class="sec">Muat ulang</button>
  <div id="jobs-msg" class="mut msg"></div>
  <div id="jobs"></div>
</section>

<section class="panel" data-panel="setelan" hidden>
  <div class="mut">Isi sekali; tersimpan di iPhone ini.</div>
  <label for="hub">URL web app hub (Apps Script)</label>
  <input id="hub" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
  <label for="tok">Token klien</label>
  <input id="tok" type="password" autocapitalize="off" autocorrect="off">
  <button id="save">Simpan</button>
  <button id="ping" class="sec">Tes koneksi</button>
  <div class="box"><div id="result" class="mut">Belum ada hasil.</div></div>
</section>

<div id="done" class="done" role="status" hidden>
  <div class="tick" aria-hidden="true">✓</div>
  <h2>Terkirim!</h2>
  <div id="done-msg" class="mut"></div>
  <div id="done-sum" class="sum"></div>
  <button id="done-again">Kirim lagi</button>
  <button id="done-jobs" class="sec">Lihat Daftar Job</button>
</div>

<nav role="tablist">
  <button role="tab" data-tab="buat" aria-selected="true">Buat Posting</button>
  <button role="tab" data-tab="daftar" aria-selected="false">Daftar Job</button>
  <button role="tab" data-tab="setelan" aria-selected="false">Pengaturan</button>
</nav>

<script src="core.js"></script>
<script src="upload.js"></script>
<script src="app.js"></script>
</body>
</html>
